<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Anamnese da família</title>
<meta name="description" content="Apresentação da família para o acompanhamento educacional Filho meu Educacional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=EB+Garamond:wght@600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FBF8F1; --grafite:#22303F; --lapis:#5E6670; --caneta:#1B3352; --verde:#2B6A5C; --ouro:#C9A35A; --ouro2:#E2C27A;
  --pauta:#E8DFCC; --marca:#F3EBDB; --alerta:#A94A28; --alerta-fundo:#FBEDE6;
  --serif:'Fraunces',Georgia,serif; --caps:'EB Garamond',Georgia,serif; --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--grafite);font:400 17px/1.55 var(--sans);overflow-x:hidden}
a{color:var(--caneta);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--caneta);outline-offset:3px;border-radius:2px}
h1,h2,h3{font-family:var(--serif);font-weight:650;letter-spacing:-.012em;margin:0;text-wrap:balance}
.w{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left))}

/* topo */
.top{display:flex;align-items:center;gap:12px;padding-block:18px 6px}
.gb{width:38px;height:auto;flex:none}
.top b{font-family:var(--serif);font-weight:600;color:var(--caneta)}
.top span{font-family:var(--caps);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.abre{display:block;width:min(220px,60vw);margin:6px auto 0}
.lema{text-align:center;font:600 13px/1 var(--caps);letter-spacing:.18em;color:var(--ouro);margin:10px 0 0}
.top b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.top span{font-size:14px;color:var(--lapis)}
.salvo{margin-left:auto;font-size:13px;color:var(--lapis);text-align:right}

/* progresso */
.prog{position:sticky;top:0;z-index:5;background:var(--papel);padding-block:12px 10px;border-bottom:2px solid var(--ouro2)}
.prog-linha{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--lapis);margin-bottom:8px}
.prog-linha b{color:var(--grafite);font-weight:600}
.barra{height:7px;background:var(--pauta);border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--ouro);transition:width .3s}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}

/* etapa */
.etapa{padding-block:28px 8px}
.etapa h1{font-size:clamp(28px,7vw,40px);line-height:1.1;color:var(--caneta)}
.etapa .intro{color:var(--lapis);margin:12px 0 0}
.intro,.ajuda,.caixa p,.item p,.resumo dd,.rodape{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.campo{margin-top:28px}
.campo>label,.campo>.rot{display:block;font-weight:600;line-height:1.35}
.campo .ajuda{display:block;font-size:15px;color:var(--lapis);margin-top:4px;font-weight:400}
input[type=text],input[type=number],textarea,select{width:100%;margin-top:10px;font:400 17px/1.4 var(--sans);color:var(--grafite);background:#fff;border:1px solid #C9BFAE;border-radius:8px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
textarea.grande{min-height:220px}
input:focus,textarea:focus,select:focus{outline:3px solid rgba(31,58,95,.22);border-color:var(--caneta)}
.opcoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opcoes label{position:relative}
.opcoes input{position:absolute;opacity:0;pointer-events:none}
.opcoes span{display:inline-block;font:500 15px/1.2 var(--sans);padding:11px 15px;transition:background .15s,border-color .15s;border:1px solid #C9BFAE;border-radius:999px;background:#fff;cursor:pointer}
.opcoes input:checked+span{background:var(--caneta);border-color:var(--caneta);color:var(--papel)}
.opcoes input:focus-visible+span{outline:3px solid var(--caneta);outline-offset:2px}
.lista-checks{display:grid;gap:10px;margin-top:12px}
.lista-checks label{display:flex;gap:12px;align-items:flex-start;line-height:1.4;cursor:pointer}
.lista-checks input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--caneta)}

/* grupos (dias) */
.grupo{margin-top:22px;border-top:1px solid var(--pauta)}
.item{padding:18px 0;border-bottom:1px solid var(--pauta)}
.item h3{font-size:19px;line-height:1.3}
.item p{margin:4px 0 0;font-size:15px;color:var(--lapis)}
.item input[type=text]{margin-top:10px}

/* visual interativo */
@keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.etapa{animation:sobe .35s ease both}
@media (prefers-reduced-motion:reduce){.etapa{animation:none}}
.cab{display:flex;align-items:center;gap:14px}
.ico{width:52px;height:52px;border-radius:14px;background:var(--caneta);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(27,51,82,.18)}
.ico svg{width:28px;height:28px;stroke:var(--ouro2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.estagio{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--caps);letter-spacing:.12em;text-transform:uppercase;color:var(--verde)}
.estagio svg{width:18px;height:18px;stroke:var(--verde);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.capa-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:22px}
.capa-cards div{background:#fff;border:1px solid var(--pauta);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;font:500 14px/1.25 var(--sans)}
.capa-cards svg{width:22px;height:22px;stroke:var(--caneta);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--caneta);color:var(--papel);padding:12px 18px;border-radius:999px;font:600 15px var(--sans);box-shadow:0 8px 24px rgba(0,0,0,.18);transition:.3s;z-index:20;max-width:90vw;text-align:center}
.toast.ve{opacity:1;transform:translate(-50%,0)}
.medidor{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lapis)}
.medidor i{flex:1;height:6px;border-radius:3px;background:var(--pauta);overflow:hidden;position:relative}
.medidor i b{position:absolute;inset:0 auto 0 0;background:var(--verde);border-radius:3px;transition:width .3s}
.niv{display:grid;gap:6px;margin-top:8px}
.niv button{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid #D8CDB8;border-radius:10px;padding:9px 12px;font:500 15px/1.3 var(--sans);color:var(--grafite);cursor:pointer}
.niv button i{width:12px;height:12px;border-radius:50%;border:2px solid #C9BFAE;flex:none}
.niv button.on{border-color:var(--caneta);background:#EEF2F7}
.niv button.on i,.niv button.antes i{background:var(--ouro);border-color:var(--ouro)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font:500 14px/1.2 var(--sans);padding:8px 12px;border:1px solid #D8CDB8;border-radius:999px;background:#fff;color:var(--grafite);cursor:pointer}
.chips button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 17px/1 var(--serif);color:#fff;flex:none}
.cartao .topo-c{display:flex;align-items:center;gap:10px}
.fim{text-align:center;padding-top:6px}
.fim img{width:min(200px,55vw)}

/* listas repetíveis e fichas dos filhos */
.rep{margin-top:12px;display:grid;gap:12px}
.rep-linha{background:#fff;border:1px solid var(--pauta);border-radius:14px;box-shadow:0 4px 14px rgba(27,51,82,.06);padding:12px 14px;display:grid;gap:8px}
.rep-linha input,.rep-linha select{margin-top:0}
.rep-linha .tira{justify-self:end;background:none;border:0;color:var(--lapis);font:500 14px var(--sans);text-decoration:underline;cursor:pointer;padding:4px}
.cartao{padding:16px 16px 10px;gap:4px}
.cartao h3{font-size:20px;color:var(--verde)}
.cartao label{display:block;font-weight:600;font-size:15px;margin-top:14px}
.cartao .ajuda{display:block}
.cartao label input,.cartao label select,.cartao label textarea{margin-top:6px;font-weight:400}
.cartao textarea{min-height:96px}
.mais{margin-top:10px;background:none;border:1px dashed #A99C86;border-radius:8px;padding:11px 14px;font:600 15px var(--sans);color:var(--caneta);cursor:pointer;width:100%}

/* caixas */
.caixa{margin-top:24px;padding:16px 18px;box-shadow:0 4px 14px rgba(27,51,82,.05);border-left:5px solid var(--ouro);background:#fff;border-radius:0 8px 8px 0}
.caixa p{margin:0}
.caixa p+p{margin-top:8px}
.alerta{border-left-color:var(--alerta);background:var(--alerta-fundo)}
.oculto{display:none}

/* navegação */
.nav{display:flex;gap:12px;justify-content:space-between;align-items:center;padding-block:30px 40px}
.btn{display:inline-block;background:var(--caneta);color:var(--papel);border:0;text-decoration:none;font:600 16px/1 var(--sans);padding:15px 22px;border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--caneta);border:1px solid var(--caneta)}
.btn.zap{background:#1F7A4D}
.acoes{display:grid;gap:12px;margin-top:22px}
.acoes .btn{text-align:center}
.etapas{margin-top:14px}.etapas summary{cursor:pointer;color:var(--caneta);font:600 15px var(--sans)}
.mapa{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.mapa button{font:500 13px var(--sans);border:1px solid var(--pauta);background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--lapis)}
.mapa button.feita{border-color:var(--verde);color:var(--verde)}
.mapa button.atual{background:var(--caneta);color:var(--papel);border-color:var(--caneta)}
.resumo{margin-top:20px;font-size:15px}
.resumo h3{font-size:18px;margin-top:22px}
.resumo dl{margin:8px 0 0;display:grid;gap:6px}
.resumo dt{color:var(--lapis)}
.resumo dd{margin:0 0 6px;white-space:pre-wrap}
.rodape{font-size:14px;color:var(--lapis);padding-block:20px 40px;border-top:1px solid var(--pauta)}
</style>
</head>
<body>
<div class="w">
  <header class="top">
    <img class="gb" src="brasao-escudo.svg" alt="" aria-hidden="true">
    <div><b>Filho meu Educacional</b><span>Acompanhamento</span></div>
    <div class="salvo" id="salvo" aria-live="polite"></div>
  </header>
</div>
<div class="prog"><div class="w">
  <div class="prog-linha"><span id="prog-nome"></span><b id="prog-num"></b></div>
  <div class="barra" role="progressbar" aria-label="Progresso da anamnese" aria-valuemin="0" aria-valuemax="100" id="barra"><i></i></div>
</div></div>
<main class="w" id="app"></main>
<div class="w"><p class="rodape">As respostas ficam guardadas só neste aparelho até vocês enviarem o arquivo. Nada é enviado pela internet enquanto vocês preenchem.</p></div>

<script>
/* Número de WhatsApp do acompanhamento, só dígitos com DDI e DDD (ex.: 5591999999999). */
const WHATSAPP = '5584999196984';
const VERSAO = '2026-10c';
const CHAVE = 'anamnese-filho-meu-v1';

/* ---------- Ícones (traço simples, cores da marca) ---------- */
const ICO = {
  inicio: '<path d="M4 5.5C6.5 4 9.5 4 12 5.5 14.5 4 17.5 4 20 5.5V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 5.5V19"/>',
  familia: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/>',
  pais: '<circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="8.5" r="2.6"/><path d="M2.5 20c.6-3.6 2.8-5.5 5.5-5.5s4.9 1.9 5.5 5.5"/><path d="M14 15.2c.8-.5 1.6-.7 2.5-.7 2.3 0 4.2 1.7 4.8 5.5"/>',
  modalidade: '<path d="M3 21h18"/><path d="M5 21V10l7-4 7 4v11"/><path d="M12 6V2.5l4 1.5-4 1.5"/><path d="M10 21v-5h4v5"/>',
  criancas: '<path d="M12 21v-8"/><path d="M12 13c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5z"/><path d="M12 15.5c0-3-2.4-5-5.5-5 0 3 2.4 5 5.5 5z"/>',
  tempo: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  palavras: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  materiais: '<path d="M5 4h4v16H5zM10 4h4v16h-4z"/><path d="m15 5.2 3.8-1 3.2 15-3.8 1z"/>',
  registros: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 13h8M8 16h5"/>',
  saude: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  fe: '<path d="M12 3v18M7.5 8h9"/>',
  objetivos: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',
  envio: '<path d="M21 3 3 10.5l7 2.5 2.5 7z"/><path d="m10 13 4.5-4.5"/>'
};
const svg = (k, cls = '') => `<svg viewBox="0 0 24 24" aria-hidden="true" class="${cls}">${ICO[k] || ''}</svg>`;
const ESTAGIOS = [['Semente', '<circle cx="12" cy="15" r="3.5"/><path d="M12 11.5V9"/>'], ['Broto', '<path d="M12 20v-7"/><path d="M12 13c0-3 2.2-5 5.5-5 0 3-2.2 5-5.5 5zM12 15c0-2.4-1.8-4-4.5-4 0 2.4 1.8 4 4.5 4z"/>'], ['Árvore', '<circle cx="12" cy="9" r="5.5"/><path d="M12 14.5V21"/>'], ['Fruto', '<circle cx="12" cy="9" r="5.5"/><path d="M12 14.5V21"/><circle cx="10" cy="8" r="1.1"/><circle cx="14" cy="10" r="1.1"/>']];
const CORES = ['#2B6A5C', '#A94A28', '#1B3352', '#8C6212', '#5B4A8B', '#3C8A76'];
const TRACOS_FILHO = ['Curioso(a)', 'Calmo(a)', 'Agitado(a)', 'Tímido(a)', 'Comunicativo(a)', 'Sensível', 'Determinado(a)', 'Distraído(a)', 'Criativo(a)', 'Perfeccionista', 'Competitivo(a)', 'Prestativo(a)', 'Teimoso(a)', 'Organizado(a)', 'Brincalhão(ona)', 'Medroso(a) diante do novo'];
const TRACOS_PAIS = ['Paciente', 'Prático(a)', 'Organizado(a)', 'Criativo(a)', 'Exigente', 'Afetuoso(a)', 'Ansioso(a)', 'Disciplinado(a)', 'Flexível', 'Canso fácil', 'Gosto de ler', 'Gosto de matemática', 'Gosto de contar histórias', 'Perco a paciência fácil'];

/* ---------- Quem é quem: as respostas que mudam o caminho ---------- */
const ESCOLA = 'Os filhos estão na escola, e queremos complementar em casa';
const CASA = 'Os filhos estudam em casa';
const MISTO = 'Uns estão na escola, outros estudam em casa';
const DECIDINDO = 'Ainda estamos decidindo';
const naEscola = d => d.modalidade === ESCOLA || d.modalidade === MISTO;
const emCasa = d => d.modalidade === CASA || d.modalidade === MISTO;
const trabalhaFora = d => d.quem_ensina_trabalho && d.quem_ensina_trabalho !== 'Não trabalha fora';
const TITULOS = ['Caligrafia cursiva com Provérbios', 'Tabuada com Provérbios', 'Leitura e interpretação com Provérbios', 'Gramática com Provérbios', 'Escrita e redação com Provérbios', 'Palavras que edificam', 'Pequenos e sábios: ciências da natureza', 'Contas, medidas e pesos justos', 'Pensar bem', 'Caráter e domínio próprio', 'Corpo, saúde e alegria', 'Dinheiro, trabalho e generosidade', 'Cartazes de parede', 'Ainda nenhum'];

/* ---------- As perguntas ----------
   Tipos: texto, longo, numero, escolha (uma), varias (várias), checks (lista de caixas),
   dias, repetir (lista que cresce; com "cartao", uma ficha com rótulos), aviso.
   "se" decide se a etapa, a pergunta ou o item aparece; "controla" redesenha a etapa
   quando a resposta muda. */
const ETAPAS = [
  { id: 'inicio', titulo: 'Antes de começar', intro: 'Com estas respostas, preparamos um plano de estudo para a família de vocês: por onde cada filho começa, quantos dias por semana, quanto tempo por lição e quais materiais usar. Leva de 30 a 40 minutos. Vocês podem parar e voltar depois: tudo fica salvo neste aparelho.', campos: [
    { tipo: 'aviso', html: '<p><b>Respondam pela rotina real da casa, e não pela ideal.</b> Não há resposta certa nem nota. O que não souberem, podem deixar em branco. Se pai e mãe puderem responder juntos, melhor.</p><p><b>Nas perguntas abertas, escrevam à vontade.</b> Quanto mais vocês contarem, mais o plano fica com a cara da família. No celular, dá para tocar no microfone do teclado e falar: o texto aparece sozinho.</p>' },
    { id: 'nome', tipo: 'texto', rotulo: 'Nome de quem está preenchendo' },
    { id: 'como_chamar', tipo: 'texto', rotulo: 'Como preferem ser chamados?', ajuda: 'Ex.: Irmã Ana e irmão Paulo; Família Souza.' },
    { id: 'consentimento', tipo: 'checks', rotulo: 'Autorizações', ajuda: 'Algumas perguntas tratam da saúde e do desenvolvimento das crianças e da fé da família. A lei de proteção de dados chama isso de dados sensíveis e pede uma autorização própria, dada pelos pais.', itens: [
      'Somos os pais ou responsáveis pelas crianças e autorizamos o uso destas respostas só para preparar o acompanhamento educacional da nossa família com o Filho meu Educacional. Elas não serão compartilhadas, e podemos pedir a exclusão quando quisermos.',
      'Autorizamos também as respostas sobre saúde, desenvolvimento e fé, para a mesma finalidade.'
    ] },
    { tipo: 'aviso', html: '<p>Sem a segunda autorização, as partes de saúde, desenvolvimento e fé ficam fechadas, e vocês respondem todo o resto.</p>' }
  ] },
  { id: 'familia', titulo: 'A família', intro: 'Quem está em casa e quem ensina.', campos: [
    { id: 'quem_preenche', tipo: 'escolha', rotulo: 'Quem está respondendo?', opcoes: ['A mãe', 'O pai', 'Pai e mãe juntos', 'Outro responsável'] },
    { id: 'quem_ensina', tipo: 'escolha', controla: true, rotulo: 'Quem acompanha os estudos das crianças no dia a dia?', opcoes: ['A mãe', 'O pai', 'Os dois, revezando', 'Avós ou outro familiar', 'Um professor ou tutor contratado'] },
    { id: 'n_filhos', tipo: 'numero', rotulo: 'Quantos filhos vocês têm?' },
    { id: 'outros_casa', tipo: 'texto', rotulo: 'Mais alguém mora com vocês ou ajuda com as crianças? (opcional)', ajuda: 'Ex.: avó que fica com o caçula de manhã.' },
    { id: 'previsao', tipo: 'repetir', rotulo: 'Algo importante previsto para os próximos 12 meses?', ajuda: 'Mudança, bebê a caminho, viagem longa, troca de trabalho. Deixem em branco se não houver.', colunas: [['fato', 'O que vai acontecer'], ['quando', 'Quando']] }
  ] },
  { id: 'pais', titulo: 'Pai, mãe e quem ensina', intro: 'Cada pessoa ensina de um jeito. Uma ficha para cada adulto que participa dos estudos, para o plano respeitar a força e o limite de cada um.', campos: [
    { id: 'adultos', tipo: 'repetir', cartao: 'Responsável', linhas: 2, mais: '+ Acrescentar outra pessoa', colunas: [
      ['nome', 'Nome'],
      ['papel', 'Quem é', ['Mãe', 'Pai', 'Avó ou avô', 'Outro familiar', 'Professor ou tutor'], 'nivel'],
      ['formacao', 'Escolaridade', ['Ensino fundamental', 'Ensino médio', 'Curso técnico ou tecnológico', 'Ensino superior', 'Pós-graduação'], 'nivel'],
      ['trabalho', 'Trabalho e horário', null, 'texto', 'Ex.: em casa; meio período, 8h às 12h; plantões.'],
      ['tempo_real', 'Quanto tempo consegue, de verdade, sentar com as crianças para estudar?', ['Quase nenhum', 'Até 1 hora por semana', '2 a 4 horas por semana', '5 a 10 horas por semana', 'Mais de 10 horas por semana'], 'nivel'],
      ['tracos', 'Como você é ao ensinar? Toque em tudo o que combina', TRACOS_PAIS, 'chips'],
      ['forte', 'O que você faz bem com as crianças', null, 'longo'],
      ['dificil', 'O que é difícil para você ao ensinar', null, 'longo'],
      ['historia', 'Como foi a sua própria vida de estudante? Do que gostava, o que era difícil', null, 'longo']

/* ---------- Estado ---------- */
let dados = {};
let atual = 0;
try { const s = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (s) { dados = s.dados || {}; atual = Math.min(s.atual || 0, ETAPAS.length - 1); } } catch (e) {}
let tSalvar;
function salvar() {
  clearTimeout(tSalvar);
  tSalvar = setTimeout(() => {
    try { localStorage.setItem(CHAVE, JSON.stringify({ dados, atual, em: new Date().toISOString() })); marcaSalvo('Salvo neste aparelho'); }
    catch (e) { marcaSalvo('Não foi possível salvar aqui; não feche a página'); }
  }, 300);
}
function marcaSalvo(t) { document.getElementById('salvo').textContent = t; }

const sensivelOk = () => (dados.consentimento || [])[1] === true;
const geralOk = () => (dados.consentimento || [])[0] === true && (dados.nome || '').trim().length > 1;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const txt = v => typeof v === 'function' ? v(dados) : v;
const ve = x => !x.se || x.se(dados);
const etapaVisivel = e => ve(e) && !(e.sensivel && !sensivelOk());
const visiveis = () => ETAPAS.filter(etapaVisivel);
const itemTexto = it => typeof it === 'string' ? it : it.t;
const itemVe = it => typeof it === 'string' || ve(it);
const DIAS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

/* ---------- Desenho dos campos ---------- */
function rotuloHtml(c) {
  return c.rotulo ? `<span class="rot" id="r-${c.id}">${esc(txt(c.rotulo))}${c.ajuda ? `<span class="ajuda">${esc(txt(c.ajuda))}</span>` : ''}</span>` : '';
}
function campoHtml(c) {
  if (!ve(c)) return '';
  const v = dados[c.id];
  const ctl = c.controla ? ' data-controla="1"' : '';
  switch (c.tipo) {
    case 'aviso': return `<div class="caixa ${c.classe || ''}" ${c.id ? `id="${c.id}"` : ''}>${c.html}</div>`;
    case 'texto': case 'numero':
      return `<div class="campo"><label for="${c.id}">${esc(txt(c.rotulo))}${c.ajuda ? `<span class="ajuda">${esc(txt(c.ajuda))}</span>` : ''}</label><input type="${c.tipo === 'numero' ? 'number' : 'text'}" id="${c.id}" data-id="${c.id}" value="${esc(v)}" ${c.tipo === 'numero' ? 'inputmode="numeric" min="0"' : ''}></div>`;
    case 'longo':
      return `<div class="campo"><label for="${c.id}">${esc(txt(c.rotulo))}${c.ajuda ? `<span class="ajuda">${esc(txt(c.ajuda))}</span>` : ''}</label><textarea id="${c.id}" data-id="${c.id}"${c.grande ? ' class="grande"' : ''}>${esc(v)}</textarea>${c.grande ? medidor(v) : ''}</div>`;
    case 'escolha': case 'varias': {
      const multi = c.tipo === 'varias';
      return `<div class="campo" role="group" aria-labelledby="r-${c.id}">${rotuloHtml(c)}<div class="opcoes">${c.opcoes.map(o => {
        const marc = multi ? (v || []).includes(o) : v === o;
        return `<label><input type="${multi ? 'checkbox' : 'radio'}" name="${c.id}" data-id="${c.id}" data-multi="${multi}"${ctl} value="${esc(o)}" ${marc ? 'checked' : ''}><span>${esc(o)}</span></label>`;
      }).join('')}</div></div>`;
    }
    case 'checks':
      return `<div class="campo" role="group" ${c.rotulo ? `aria-labelledby="r-${c.id}"` : ''}>${rotuloHtml(c)}<div class="lista-checks">${c.itens.map((it, i) => itemVe(it) ? `<label><input type="checkbox" data-id="${c.id}" data-idx="${i}" data-n="${c.itens.length}"${c.id === 'consentimento' || c.id === 'sinais' ? ' data-controla="1"' : ''} ${(v || [])[i] ? 'checked' : ''}><span>${esc(itemTexto(it))}</span></label>` : '').join('')}</div></div>`;
    case 'dias':
      return `<div class="campo">${rotuloHtml(c)}<div class="grupo">${DIAS.map((d, i) => `<div class="item"><label for="dia-${i}"><b>${d}</b></label><input type="text" id="dia-${i}" data-dia="${i}" data-id="${c.id}" value="${esc((v || [])[i])}" placeholder="Ex.: 8h–10h"></div>`).join('')}<div class="item"><b>Domingo</b><p>Dia do Senhor: fica fora do estudo.</p></div></div></div>`;
    case 'repetir': {
      const linhas = (v && v.length) ? v : Array.from({ length: c.linhas || 1 }, () => ({}));
      return `<div class="campo">${rotuloHtml(c)}<div class="rep" id="rep-${c.id}">${linhas.map((l, i) => linhaRep(c, l, i)).join('')}</div><button type="button" class="mais" data-mais="${c.id}">${esc(c.mais || '+ Acrescentar linha')}</button></div>`;
    }
  }
  return '';
}
function linhaRep(c, l, i) {
  const at = k => `data-rep="${c.id}" data-linha="${i}" data-col="${k}"`;
  if (c.cartao) {
    const ini = (l.nome || '').trim().charAt(0).toUpperCase() || (i + 1);
    return `<div class="rep-linha cartao"><div class="topo-c"><span class="avatar" style="background:${CORES[i % CORES.length]}">${esc(ini)}</span><h3>${esc(l.nome || `${c.cartao} ${i + 1}`)}</h3></div>${c.colunas.map(([k, nome, ops, tipo, ajuda]) => {
      const rot = `<span>${esc(nome)}</span>${ajuda ? `<span class="ajuda" style="font-weight:400;font-size:14px;color:var(--lapis)">${esc(ajuda)}</span>` : ''}`;
      if (tipo === 'nivel') { const idx = ops.indexOf(l[k]); return `<div class="campo-c"><label>${rot}</label><div class="niv"><input type="hidden" ${at(k)} value="${esc(l[k])}">${ops.map((o, j) => `<button type="button" data-niv="${j}" class="${j === idx ? 'on' : (idx > j && ops.length > 3 ? 'antes' : '')}"><i></i>${esc(o)}</button>`).join('')}</div></div>`; }
      if (tipo === 'chips') { const sel = (l[k] || '').split('; ').filter(Boolean); return `<div class="campo-c"><label>${rot}</label><div class="chips"><input type="hidden" ${at(k)} value="${esc(l[k])}">${ops.map(o => `<button type="button" data-chip="${esc(o)}" class="${sel.includes(o) ? 'on' : ''}">${esc(o)}</button>`).join('')}</div></div>`; }
      return `<label>${rot}${ops
      ? `<select ${at(k)}><option value="">Escolher</option>${ops.map(o => `<option ${l[k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : tipo === 'longo' ? `<textarea ${at(k)}>${esc(l[k])}</textarea>` : `<input type="text" ${at(k)} value="${esc(l[k])}">`}</label>`; }).join('')}<button type="button" class="tira" data-tira="${c.id}" data-linha="${i}">tirar esta ficha</button></div>`;
  }
  return `<div class="rep-linha">${c.colunas.map(([k, nome, ops]) => ops
    ? `<select aria-label="${esc(nome)}" ${at(k)}><option value="">${esc(nome)}</option>${ops.map(o => `<option ${l[k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
    : `<input type="text" aria-label="${esc(nome)}" placeholder="${esc(nome)}" ${at(k)} value="${esc(l[k])}">`).join('')}<button type="button" class="tira" data-tira="${c.id}" data-linha="${i}">tirar</button></div>`;
}

function medidor(v) {
  const n = String(v || '').trim().split(/\s+/).filter(Boolean).length;
  const pct = Math.min(100, Math.round(n / 1.2));
  const msg = n === 0 ? 'Comecem quando quiserem' : n < 30 ? 'Bom começo' : n < 80 ? 'Muito bom, continuem' : n < 120 ? 'Ótimo: isso ajuda muito' : 'Excelente, obrigado pelos detalhes';
  return `<div class="medidor" aria-live="polite"><i><b style="width:${pct}%"></b></i><span>${msg}</span></div>`;
}
function toast(t) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = t; el.classList.add('ve'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('ve'), 2400);
}

/* ---------- Telas ---------- */
function render() {
  const lista = visiveis();
  if (!etapaVisivel(ETAPAS[atual])) atual = ETAPAS.indexOf(lista.find(x => ETAPAS.indexOf(x) > atual) || lista[lista.length - 1]);
  const e = ETAPAS[atual];
  const pos = lista.indexOf(e);
  const app = document.getElementById('app');
  document.getElementById('prog-nome').textContent = e.titulo;
  document.getElementById('prog-num').textContent = `${pos + 1} de ${lista.length}`;
  const pct = Math.round(100 * pos / (lista.length - 1));
  const barra = document.getElementById('barra');
  barra.querySelector('i').style.width = pct + '%';
  barra.setAttribute('aria-valuenow', pct);
  const est = ESTAGIOS[Math.min(3, Math.floor(pct / 25.01))];
  document.getElementById('prog-nome').innerHTML = `<span class="estagio"><svg viewBox="0 0 24 24">${est[1]}</svg>${est[0]}</span>`;
  document.getElementById('prog-num').textContent = `${e.titulo} · ${pos + 1} de ${lista.length}`;

  let corpo;
  if (e.id === 'envio') corpo = telaEnvio();
  else if (e.sensivel && !sensivelOk()) corpo = `<div class="caixa"><p>Esta parte fica fechada, porque a autorização de dados sensíveis não foi marcada. Se quiserem responder, voltem ao início e marquem a segunda autorização.</p></div>`;
  else corpo = e.campos.map(campoHtml).join('');

  const botoes = `<nav class="mapa" aria-label="Etapas">${lista.map(x => { const i = ETAPAS.indexOf(x); return `<button type="button" data-ir="${i}" class="${i === atual ? 'atual' : (lista.indexOf(x) < pos ? 'feita' : '')}" ${i === atual ? 'aria-current="step"' : ''}>${esc(x.titulo)}</button>`; }).join('')}</nav>`;
  const mapa = atual === 0 ? '' : (e.id === 'envio' ? botoes : `<details class="etapas"><summary>Ver todas as etapas</summary>${botoes}</details>`);
  const intro = txt(e.intro);
  const capa = atual === 0 ? '<img class="abre" src="brasao.png" alt="Brasão do Filho meu Educacional">' : '';
  const cards = atual === 0 ? `<div class="capa-cards">${lista.filter(x => x.id !== 'inicio' && x.id !== 'envio').map(x => `<div>${svg(x.id)}${esc(x.titulo)}</div>`).join('')}</div>` : '';
  const cab = atual === 0 ? `<h1 tabindex="-1" id="tit">${esc(e.titulo)}</h1>` : `<div class="cab"><span class="ico">${svg(e.id)}</span><h1 tabindex="-1" id="tit">${esc(e.titulo)}</h1></div>`;
  app.innerHTML = `<section class="etapa">${capa}${cab}${intro ? `<p class="intro">${esc(intro)}</p>` : ''}${cards}${mapa}${corpo}</section>
  <div class="nav">${pos > 0 ? '<button type="button" class="btn sec" id="voltar">Voltar</button>' : '<span></span>'}${e.id !== 'envio' ? `<button type="button" class="btn" id="seguir" ${atual === 0 && !geralOk() ? 'disabled' : ''}>${atual === 0 ? 'Começar' : 'Continuar'}</button>` : ''}</div>`;
}
const INCENTIVO = ['Ótimo começo!', 'Muito bem!', 'Isso nos ajuda muito.', 'Vocês estão indo bem.', 'Mais uma parte pronta.', 'Seguimos juntos.'];
function passo(dir) {
  const lista = visiveis();
  const pos = lista.indexOf(ETAPAS[atual]);
  const alvo = lista[Math.max(0, Math.min(lista.length - 1, pos + dir))];
  if (dir > 0 && pos > 0) { const faltam = lista.length - 2 - pos; toast(faltam > 0 ? `${INCENTIVO[pos % INCENTIVO.length]} Faltam ${faltam} ${faltam === 1 ? 'parte' : 'partes'}.` : 'Tudo respondido! Agora é só revisar e enviar.'); }
  ir(ETAPAS.indexOf(alvo));
}
function ir(i) {
  if (i > 0 && !geralOk()) i = 0;
  atual = Math.max(0, Math.min(ETAPAS.length - 1, i));
  salvar(); render();
  window.scrollTo({ top: 0 });
  document.getElementById('tit')?.focus({ preventScroll: true });
}
function redesenhaMantendo() {
  const y = window.scrollY; render(); window.scrollTo({ top: y });
}

/* ---------- Eventos ---------- */
const app = document.getElementById('app');
function aoMudar(ev) {
  const t = ev.target, d = t.dataset;
  if (!d) return;
  if (d.rep) { const c = achaCampo(d.rep); dados[d.rep] = lerRep(c); if (d.col === 'nome' && c.cartao) { const h = t.closest('.cartao').querySelector('h3'); const av = t.closest('.cartao').querySelector('.avatar'); h.textContent = t.value || `${c.cartao} ${+d.linha + 1}`; av.textContent = (t.value.trim().charAt(0).toUpperCase()) || (+d.linha + 1); } }
  else if (d.dia !== undefined) { const a = dados[d.id] || []; a[+d.dia] = t.value; dados[d.id] = a; }
  else if (d.idx !== undefined) { const a = dados[d.id] || Array(+d.n).fill(false); a[+d.idx] = t.checked; dados[d.id] = a; }
  else if (d.multi === 'true') { const a = new Set(dados[d.id] || []); t.checked ? a.add(t.value) : a.delete(t.value); dados[d.id] = [...a]; }
  else if (d.id) { dados[d.id] = t.type === 'number' ? (t.value === '' ? '' : +t.value) : t.value; if (t.classList.contains('grande')) { const m = t.parentElement.querySelector('.medidor'); if (m) m.outerHTML = medidor(t.value); } }
  if (atual === 0) { const b = document.getElementById('seguir'); if (b) b.disabled = !geralOk(); }
  salvar();
  if (ev.type === 'change' && d.controla) redesenhaMantendo();
}
app.addEventListener('input', aoMudar);
app.addEventListener('change', aoMudar);
app.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.niv !== undefined || t.dataset.chip !== undefined) {
    const box = t.parentElement, inp = box.querySelector('input[type=hidden]');
    if (t.dataset.niv !== undefined) {
      const j = +t.dataset.niv, bts = [...box.querySelectorAll('button')], ja = t.classList.contains('on');
      inp.value = ja ? '' : t.textContent; bts.forEach((b, k) => { b.classList.toggle('on', !ja && k === j); b.classList.toggle('antes', !ja && k < j && bts.length > 3); });
    } else {
      t.classList.toggle('on'); inp.value = [...box.querySelectorAll('button.on')].map(b => b.dataset.chip).join('; ');
    }
    inp.dispatchEvent(new Event('input', { bubbles: true })); return;
  }
  if (t.id === 'seguir') passo(1);
  else if (t.id === 'voltar') passo(-1);
  else if (t.dataset.ir) ir(+t.dataset.ir);
  else if (t.dataset.mais) { const c = achaCampo(t.dataset.mais); const arr = lerRep(c); arr.push({}); dados[c.id] = arr; salvar(); redesenhaRep(c); }
  else if (t.dataset.tira) { const c = achaCampo(t.dataset.tira); const arr = lerRep(c); arr.splice(+t.dataset.linha, 1); dados[c.id] = arr; salvar(); redesenhaRep(c); }
  else if (t.id === 'baixar') baixarFicha();
  else if (t.id === 'compartilhar') compartilharFicha();
  else if (t.id === 'apagar') { if (confirm('Apagar todas as respostas deste aparelho? Não há como desfazer.')) { dados = {}; try { localStorage.removeItem(CHAVE); } catch (e) {} ir(0); } }
});
function achaCampo(id) { for (const e of ETAPAS) for (const c of e.campos) if (c.id === id) return c; }
function lerRep(c) {
  const box = document.getElementById('rep-' + c.id);
  return [...box.querySelectorAll('.rep-linha')].map(l => Object.fromEntries([...l.querySelectorAll('[data-col]')].map(x => [x.dataset.col, x.value])));
}
function redesenhaRep(c) { const box = document.getElementById('rep-' + c.id); const arr = dados[c.id]; box.innerHTML = (arr.length ? arr : [{}]).map((l, i) => linhaRep(c, l, i)).join(''); }

/* ---------- Só o que está visível vai para o arquivo ---------- */
function etapasRespondiveis() { return visiveis().filter(e => e.id !== 'envio' && !(e.sensivel && !sensivelOk())); }
function dadosVisiveis() {
  const out = { nome: dados.nome, como_chamar: dados.como_chamar, consentimento: dados.consentimento };
  for (const e of etapasRespondiveis()) for (const c of e.campos) {
    if (!c.id || c.tipo === 'aviso' || !ve(c) || dados[c.id] === undefined) continue;
    let v = dados[c.id];
    if (c.tipo === 'checks') v = c.itens.map((it, i) => itemVe(it) ? !!(v || [])[i] : false);
    out[c.id] = v;
  }
  return out;
}
function valorTexto(c, v) {
  if (v === undefined || v === '' || v === null) return '';
  switch (c.tipo) {
    case 'varias': return (v || []).join('; ');
    case 'checks': return c.itens.filter((it, i) => v[i] && itemVe(it)).map(itemTexto).join('; ');
    case 'dias': return DIAS.map((d, i) => v[i] ? `${d}: ${v[i]}` : '').filter(Boolean).join('\n');
    case 'repetir':
      if (c.cartao) return v.filter(l => Object.values(l).some(Boolean)).map((l, i) => `${c.cartao} ${i + 1}\n` + c.colunas.filter(([k]) => l[k]).map(([k, nome]) => `  ${nome}: ${l[k]}`).join('\n')).join('\n\n');
      return v.filter(l => Object.values(l).some(Boolean)).map(l => c.colunas.map(([k]) => l[k]).filter(Boolean).join(' · ')).join('\n');
    default: return String(v);
  }
}
function resumoHtml() {
  const dv = dadosVisiveis();
  return etapasRespondiveis().filter(e => e.id !== 'inicio').map(e => {
    const linhas = e.campos.filter(c => c.id && c.tipo !== 'aviso' && ve(c)).map(c => {
      const t = valorTexto(c, dv[c.id]); if (!t) return '';
      return `<dt>${esc(txt(c.rotulo) || e.titulo)}</dt><dd>${esc(t)}</dd>`;
    }).join('');
    return `<h3>${esc(e.titulo)}</h3>${linhas ? `<dl>${linhas}</dl>` : '<p>Sem respostas.</p>'}`;
  }).join('');
}
function telaEnvio() {
  const partes = etapasRespondiveis().filter(e => e.id !== 'inicio');
  const respondidas = partes.filter(e => e.campos.some(c => c.id && ve(c) && valorTexto(c, dadosVisiveis()[c.id]))).length;
  const zap = WHATSAPP ? `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(`Olá, Gullit! Aqui é ${dados.nome || ''}. Terminamos a anamnese da família e vou enviar o arquivo agora.`)}` : '';
  return `<div class="fim"><img src="brasao.png" alt=""><p class="intro" style="text-align:center">Obrigado, ${esc(dados.como_chamar || dados.nome || '')}! Cada resposta vai virar uma orientação feita para a família de vocês.</p></div><p class="intro">Vocês responderam ${respondidas} de ${partes.length} partes. Confiram abaixo. Se quiserem mudar algo, toquem na etapa.</p>
  <div class="caixa"><p><b>Como enviar:</b> gerem o arquivo da anamnese (um arquivo só, que abre em qualquer celular) e enviem pelo WhatsApp, como documento.</p></div>
  <div class="acoes">
    <button type="button" class="btn" id="compartilhar">Gerar e enviar o arquivo</button>
    <button type="button" class="btn sec" id="baixar">Só baixar o arquivo</button>
    ${zap ? `<a class="btn zap" href="${zap}" target="_blank" rel="noopener">Abrir o WhatsApp</a>` : ''}
  </div>
  <div class="resumo">${resumoHtml()}</div>
  <div class="caixa"><p>Depois de enviar, vocês podem apagar as respostas deste aparelho.</p><p><button type="button" class="btn sec" id="apagar">Apagar respostas deste aparelho</button></p></div>`;
}

/* O arquivo enviado: uma página legível que leva os dados completos embutidos. */
function nomeArquivo() {
  const n = (dados.nome || 'familia').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  return `anamnese-familia-${n}-${new Date().toISOString().slice(0, 10)}.html`;
}
function fichaHtml() {
  const pacote = { tipo: 'anamnese-filho-meu-educacional', versao: VERSAO, enviado_em: new Date().toISOString(), sensivel_autorizado: sensivelOk(), dados: dadosVisiveis() };
  const json = JSON.stringify(pacote).replace(/</g, '\\u003c');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anamnese da família · ${esc(dados.nome || '')}</title>
<style>body{margin:0;background:#FBF8F1;color:#22303F;font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}main{max-width:720px;margin:0 auto;padding:24px 16px 48px}h1{font:650 30px/1.15 Georgia,serif;margin:0;color:#1B3352}h3{font:650 19px/1.3 Georgia,serif;margin:28px 0 6px;padding-top:16px;border-top:1px solid #C9A35A}dt{color:#5E6670;margin-top:8px}dd{margin:0;white-space:pre-wrap;text-align:justify;hyphens:auto}.meta{color:#5E6670;margin-top:6px}</style></head>
<body><main><p class="meta">Filho meu Educacional · Acompanhamento da família</p><h1>Anamnese da família de ${esc(dados.como_chamar || dados.nome || '')}</h1><p class="meta">Preenchida por ${esc(dados.nome || '')}. Enviada em ${new Date().toLocaleDateString('pt-BR')}. Documento pessoal e confidencial.</p>${resumoHtml()}</main>
<script type="application/json" id="dados-anamnese">${json}<\/script></body></html>`;
}
function baixarFicha() {
  const blob = new Blob([fichaHtml()], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nomeArquivo();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function compartilharFicha() {
  const arquivo = new File([fichaHtml()], nomeArquivo(), { type: 'text/html' });
  if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
    try { await navigator.share({ files: [arquivo], title: 'Anamnese da família', text: `Anamnese da família de ${dados.como_chamar || dados.nome || ''}` }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  baixarFicha();
  alert('O arquivo foi baixado. Agora abram o WhatsApp e enviem esse arquivo como documento.');
}

render();
if (Object.keys(dados).length) marcaSalvo('Respostas recuperadas');
</script>
</body>
</html>
